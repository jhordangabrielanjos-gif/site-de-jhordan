<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jhordan Gabriel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f0f0f;
    color:rgb(202, 175, 175);
}

header{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:linear-gradient(135deg,#000,#1a1a1a);
}

header h1{
    font-size:4rem;
    color:#fdfffe;
}

header p{
    margin-top:10px;
    font-size:1.2rem;
    color:#ccc;
}

a{
    display:block;
    width:250px;
    margin:20px auto;
    text-align:center;
    text-decoration:none;
    background:#66ca4d;
    color:#000;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
    transition:.3s;
}

a:hover{
    transform:translateY(-5px);
    box-shadow:0 0 15px #b10c0c;
}

.btn{
    margin-top:20px;
    padding:12px 30px;
    background:#00ff88;
    color:black;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.1);
}

section{
    padding:80px 10%;
}

h2{
    text-align:center;
    margin-bottom:30px;
    color:#afd385;
}

.sobre{
    text-align:center;
    line-height:1.8;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#1a1a1a;
    padding:25px;
    border-radius:15px;
    transition:.3s;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 0 20px #83db7b;
}

footer{
    text-align:center;
    padding:20px;
    background:black;
    color:#999;
}

#particulas{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:-1;
}
</style>
</head>
<body>

<canvas id="particulas"></canvas>

<header>
    <h1 id="nome"></h1>
    <p> visionario • trabalhador • esforçado</p>
    <a href="#sobre" class="btn">Conheça Mais</a>
</header>

<section id="sobre">
    <h2>Sobre Mim</h2>
    <div class="sobre">
        <p>
            Olá! Eu sou Jhordan Gabriel.
            Bem-vindo ao meu site pessoal, entre em contato para averguar suas ideias 
        </p>
    </div>
</section>

<section>

    <div class="cards">
        <div class="card">
            <a href="pagina2.html">
              SOBRE MIM
            </a>
        </div>
</section>

<section>
    <h2>Contato</h2>
    <div class="sobre">
        <p>Email: @jhordangabrielanjos.com</p>
        <p>Instagram: @jhordan.cw</p>
    </div>
</section>

<footer>
    © 2026 - Jhordan Gabriel
</footer>

<script>
// Texto digitando
const texto = "Jhordan Gabriel";
let i = 0;

function escrever(){
    if(i < texto.length){
        document.getElementById("nome").innerHTML += texto.charAt(i);
        i++;
        setTimeout(escrever,150);
    }
}
escrever();

// Partículas
const canvas = document.getElementById("particulas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<100;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*3,
        dx:(Math.random()-0.5),
        dy:(Math.random()-0.5)
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle="#00ff88";
        ctx.fill();

        p.x += p.dx;
        p.y += p.dy;

        if(p.x<0||p.x>canvas.width) p.dx*=-1;
        if(p.y<0||p.y>canvas.height) p.dy*=-1;
    });

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
